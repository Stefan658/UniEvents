version: "3.9"

services:
  db:
    image: postgres:16
    container_name: uni_events_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uni_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: uni_events_backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-uni_events}
      - FLASK_DEBUG=True
      - FLASK_APP=backend.app:create_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade --directory backend/migrations && python backend/app.py"

  frontend:
    build: ./frontend
    container_name: uni_events_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data: