services:
  db:
    image: postgres:16
    container_name: uni_events_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uni_events}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: uni_events_backend
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-uni_events}
      - FLASK_DEBUG=False
      - FLASK_APP=backend.app:create_app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade --directory backend/migrations && gunicorn --bind 0.0.0.0:5000 \"backend.app:create_app()\""

  frontend:
    build: ./frontend
    container_name: uni_events_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: